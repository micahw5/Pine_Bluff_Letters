<style>
  /* Your full original CSS - unchanged */
  :root {
    --black: #0d0d0d; --dark: #1a1a1a; --purple-dark: #2a1245; --purple: #3b1f5e;
    --purple-mid: #4e2b7a; --purple-light: #6b3fa0; --gold: #c9a84c; --gold-light: #e0c070;
    --gold-dark: #a07830; --white: #ffffff; --off-white: #f5f3f0; --gray-light: #e8e4ee;
    --gray-mid: #b0a8c0; --gray-dark: #4a4458; --text-dark: #1a1020;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: var(--off-white); color: var(--text-dark); font-size: 15px; }

  header {
    background: linear-gradient(135deg, var(--black) 0%, var(--purple-dark) 60%, var(--purple) 100%);
    color: var(--white); padding: 16px 28px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.5); border-bottom: 2px solid var(--gold);
  }
  .container { max-width: 860px; margin: 28px auto; padding: 0 16px 60px; }

  .card { background: var(--white); border-radius: 10px; box-shadow: 0 2px 8px rgba(59,31,94,0.12); margin-bottom: 22px; overflow: hidden; border: 1px solid var(--gray-light); }
  .card-header { background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%); color: var(--white); padding: 12px 20px; font-size: 14px; font-weight: 700; }
  .card-body { padding: 20px; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-dark); margin-bottom: 5px; }
  input, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--gray-light); border-radius: 6px; font-size: 14px; background: var(--off-white); }
  input:focus, textarea:focus { border-color: var(--purple-light); background: var(--white); }

  .btn-success { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%); color: var(--white); padding: 13px 28px; width: 100%; font-weight: 700; border: 1px solid var(--gold); }
  .lookup-btn { background: var(--gold); color: #000; font-weight: bold; width: 100%; margin: 10px 0; }
</style>

<div class="container">

  <div class="toggle-tabs">
    <button id="tab-agol" class="active" onclick="switchTab('agol')">AGOL Reports</button>

  </div>

  <!-- AGOL Panel -->
  <div id="panel-agol">
    <input type="text" id="search-input" placeholder="Search reports..." onkeyup="filterReports()" style="width:100%;padding:10px;margin-bottom:10px;">
    <div id="report-list" class="report-list"></div>

    <div id="pop-preview" class="card" style="display:none;">
      <div class="card-header">Selected Report</div>
      <div class="card-body">
        <div class="form-group">
          <label>Owner Name</label>
          <input type="text" id="owner-agol">
        </div>
        <div class="form-group">
          <label>Owner Mailing Address</label>
          <textarea id="owner-mailing-agol" rows="3" placeholder="Paste from ActDataScout here"></textarea>
        </div>
        <button onclick="lookupOwnerInfo()" class="lookup-btn">🔍 Lookup on ActDataScout</button>
      </div>
    </div>
  </div>

  <!-- Violations -->
  <div class="card">
    <div class="card-header">Violations</div>
    <div class="card-body">
      <div id="vgrid" class="violation-grid"></div>
    </div>
  </div>

  <button class="btn btn-success" id="gen-btn" onclick="generateDocument()">Generate Violation Notice (.docx)</button>

</div>

<script>
// ==================== YOUR ORIGINAL CODE (kept intact) ====================
var LAYER_URL = 'https://services5.arcgis.com/t2t1phUp5Bj3z8Lp/arcgis/rest/services/Requests_da4f32658a6549c1ac33550f361e607d/FeatureServer/0';

var F = {
  requestId : 'OBJECTID',
  category  : 'reqcategory',
  type      : 'reqtype',
  details   : 'details',
  notes     : 'notes',
  date      : 'created_date',
  parcel    : 'Parcel_Number',
  lot       : 'Lot',
  officer   : 'Officer_Name',
  address   : 'locdesc',
  owner     : 'pocfirstname',
  refNumber : 'Account_Number',
};

var allReports = [];
var selectedReport = null;
var activeTab = 'agol';

var VIOLATIONS = [ /* your full VIOLATIONS array */ ];

// NEW: Lookup function
function lookupOwnerInfo() {
  if (!selectedReport || !selectedReport.Parcel_Number) {
    alert("Please select a report first.");
    return;
  }
  const parcel = encodeURIComponent(selectedReport.Parcel_Number);
  window.open(`https://www.actdatascout.com/RealProperty/Arkansas/Jefferson?parcel=${parcel}`, '_blank');
}

// UPDATED getFields with mailing address
function getFields() {
  if (activeTab === 'agol' && selectedReport) {
    var a = selectedReport;
    var rawDate = a[F.date];
    var dateVal = rawDate ? new Date(rawDate).toISOString().split('T')[0] : '';
    return {
      ownerName: document.getElementById('owner-agol').value.trim(),
      ownerMailing: document.getElementById('owner-mailing-agol').value.trim(),
      propertyAddress: String(a[F.address] || ''),
      parcelNumber: String(a[F.parcel] || ''),
      legalDesc: String(a[F.lot] || ''),
      officerName: String(a[F.officer] || ''),
      inspectionDate: dateVal,
      notes: [a[F.details], a[F.notes]].filter(Boolean).join(' | '),
      requestId: String(a[F.requestId] || ''),
      refNumber: String(a[F.refNumber] || ''),
    };
  }
  // manual tab (add fields if needed)
  return {
    ownerName: document.getElementById('m-owner') ? document.getElementById('m-owner').value.trim() : '',
    ownerMailing: document.getElementById('m-mailing') ? document.getElementById('m-mailing').value.trim() : '',
    propertyAddress: document.getElementById('m-address') ? document.getElementById('m-address').value.trim() : '',
    parcelNumber: document.getElementById('m-parcel') ? document.getElementById('m-parcel').value.trim() : '',
    legalDesc: '',
    officerName: '',
    inspectionDate: '',
    notes: '',
    requestId: '',
    refNumber: '',
  };
}

// UPDATED buildLetterText to include mailing address
function buildLetterText(f, violations) {
  // your original code
  var L = '';
  L += 'CODE ENFORCEMENT DEPARTMENT\n';
  L += '200 E. 8th Avenue, Suite 103  |  Pine Bluff, AR 71601\n';
  L += '(870) 730-2021   FAX (870) 730-2152\n\n';
  L += 'GRASS/WEED &/OR JUNK VIOLATION NOTICE\n\n';
  L += 'DATE: ' + formatDate(f.inspectionDate) + '\n\n';
  L += 'Property Violation Location: ' + (f.propertyAddress || '[Address]') + '\n';
  L += (f.ownerName || '[OWNER NAME]') + '\n';
  L += (f.ownerMailing || '') + '\n\n';
  L += 'Parcel:   ' + (f.parcelNumber || '—') + '\n';
  L += 'Dear ' + (f.ownerName || '[Owner Name]') + ',\n';
  // ... rest of your original letter text ...
  return L;
}

// Your original buildDocXml, buildZip, etc. remain the same. Just make sure to add ownerMailing in the same way as above.

buildViolationGrid();
document.getElementById('m-date').value = new Date().toISOString().split('T')[0];
loadReports();
